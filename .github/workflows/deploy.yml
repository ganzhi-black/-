name: CI/CD Build and Deploy

on:
  push:
    branches:
      - main  # 只有推送到 main 分支时才触发部署，如果你的默认分支是 master 请改成 master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 设置 Node.js 环境
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-size: 20
          node-version: 22

      # 3. 安装依赖并编译前端 (生成 dist 目录)
      - name: Install and Build Frontend
        run: |
          npm ci
          npm run build

      # 4. 打包要发送到服务器的文件 (排除 node_modules, .git, 视频文件)
      - name: Package Project
        run: |
          tar -czf release.tar.gz \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=.github \
            --exclude=*.mp4 \
            --exclude=*.zip \
            --exclude=.tmp* \
            --exclude=*.log \
            --exclude=*.err \
            .

      # 5. 上传压缩包到阿里云服务器
      - name: Copy via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USERNAME }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: 22
          source: "release.tar.gz"
          target: "/www/wwwroot/qimoshua"

      # 6. SSH 登录阿里云执行解压、Docker 构建与运行
      - name: SSH Command and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USERNAME }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: 22
          script: |
            cd /www/wwwroot/qimoshua
            # 解压覆盖
            tar -xzf release.tar.gz
            rm release.tar.gz
            
            # 构建 Docker 镜像
            docker build -t qimoshua:latest .
            
            # 停止并删除旧容器
            docker stop qimoshua || true
            docker rm qimoshua || true
            
            # 启动新容器（指定已经放在服务器上的 .env 环境变量文件）
            docker run -d \
              --name qimoshua \
              --restart unless-stopped \
              -p 8787:8787 \
              --env-file /www/wwwroot/qimoshua/.env \
              qimoshua:latest
